name: 🛠️👀
# https://stackoverflow.com/questions/71155641/github-actions-how-to-view-inputs-for-workflow-dispatch
# https://docs.github.com/ja/actions/reference/evaluate-expressions-in-workflows-and-actions#format
run-name: |
  ${{ inputs.pr-number && format('NixOS/nixpkgs#{0}', inputs.pr-number) || format('nixpkgs-review: {0}', inputs.args) }}
# run-name: '[Experimental]' # Enable only when developing
on:
  # pull_request: # Enable only when developing
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number'
        required: false
        type: string # Don't use `number` type here, GitHub Apps in both Android and iOS forces them as 'Float'
        default: ''
      x86_64-linux:
        description: 'x86_64-linux (ubuntu-26.04)'
        type: boolean
        default: true
      aarch64-linux:
        description: 'aarch64-linux (ubuntu-26.04-arm)'
        type: boolean
        default: true
      aarch64-darwin:
        description: 'aarch64-darwin (macos-26, sandbox=true)'
        type: boolean
        default: true
      aarch64-darwin-relaxed:
        description: 'aarch64-darwin (macos-26, sandbox=false)'
        type: boolean
        default: true
      free-up-diskspace:
        description: 'Free up disk space'
        type: boolean
        default: false
      run-tests:
        description: 'Run package tests if exist (--tests)'
        type: boolean
        default: false
      args:
        # Use this option if your requirement is not simple. Might be needed for mass-rebuilds.

        # For example:
        # ```
        # pr 380842 -p crystalline -p ameba -p ameba-ls -p mint --package-regex 'crystal_.*' --print-result
        # ```

        # See https://github.com/Mic92/nixpkgs-review/blob/d46f823c058c445e8b50ca93b32c495b3dda1b25/README.md?plain=1#L312-L347 for detail
        description: 'Customized arguments. Ignore `pr-number`'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.pr-number }}-${{ inputs.args }}
  cancel-in-progress: true

# env:
#   pr-number: '42' # Enable only when developing

jobs:
  setup:
    name: setup
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Validate options
        if: ${{ inputs.args != '' && inputs.pr-number != '' }}
        run: |
          echo '❌ Error: Specify either "PR number" or "Customized arguments", not both.'
          exit 2

      - name: Validate PR number
        if: ${{ inputs.pr-number != '' }}
        env:
          INPUT_PR_NUMBER: '${{ inputs.pr-number }}'
        run: |
          # Check if the input is a positive integer (greater than 0)
          if ! [[ "$INPUT_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "❌ Error: The input \"$INPUT_PR_NUMBER\" is not a valid positive integer (e.g., 1, 42)."
            exit 1
          fi

          echo "✅ Input \"$INPUT_PR_NUMBER\" is a valid positive integer."

      - name: Generate matrix
        id: set-matrix
        env:
          ENABLE_X86_64_LINUX: ${{ inputs.x86_64-linux }}
          ENABLE_AARCH64_LINUX: ${{ inputs.aarch64-linux }}
          ENABLE_AARCH64_DARWIN: ${{ inputs.aarch64-darwin }}
          ENABLE_AARCH64_DARWIN_RELAXED: ${{ inputs.aarch64-darwin-relaxed }}
        run: |
          matrix=()
          if [ "$ENABLE_X86_64_LINUX" = "true" ]; then
            matrix+=('{"name":"x86_64-linux","runner":"ubuntu-26.04","sandbox":true,"asset_name":"X64-Linux"}')
          fi
          if [ "$ENABLE_AARCH64_LINUX" = "true" ]; then
            matrix+=('{"name":"aarch64-linux","runner":"ubuntu-26.04-arm","sandbox":true,"asset_name":"ARM64-Linux"}')
          fi
          if [ "$ENABLE_AARCH64_DARWIN" = "true" ]; then
            matrix+=('{"name":"aarch64-darwin (sandbox=true)","runner":"macos-26","sandbox":true,"asset_name":"ARM64-macOS-sandbox-true"}')
          fi
          if [ "$ENABLE_AARCH64_DARWIN_RELAXED" = "true" ]; then
            matrix+=('{"name":"aarch64-darwin (sandbox=false)","runner":"macos-26","sandbox":false,"asset_name":"ARM64-macOS-sandbox-false"}')
          fi

          if [ ${#matrix[@]} -eq 0 ]; then
            echo "❌ Error: At least one target must be selected." >&2
            exit 1
          fi

          json="[$(IFS=,; echo "${matrix[*]}")]"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  review:
    name: review (${{ matrix.name }})
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    continue-on-error: true # Simply avoiding the state for #91
    runs-on: ${{ matrix.runner }}
    # timeout-minutes: 180 # Any limitations might not fit for this repository. So temporary disabling
    steps:
      - name: Make sure dependent environments
        id: get-meta
        run: | # shell
          #
          # https://github.com/Mic92/nixpkgs-review/blob/055465e55d131ffb1e1617f46d3bade0b87bbe69/nixpkgs_review/builddir.py#L24-L36
          echo "cache_dir=${XDG_CACHE_HOME:-${HOME}/.cache}" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: '.repo-to-get-flake-lock'
          persist-credentials: false

      - name: Move this repository to a temporary directory to avoid overlap with nixpkgs
        run: |
          target_path="${RUNNER_TEMP}/${GITHUB_REPOSITORY}"
          mkdir -p "$(dirname "$target_path")"
          mv .repo-to-get-flake-lock "$target_path"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'NixOS/nixpkgs'
          persist-credentials: false

      - name: Make sure the shallow clone or not
        # Often needed for debugging purpose. See GH-26 https://github.com/Mic92/nixpkgs-review/pull/426/files#diff-068fea7dedadb885b7dcccc0fe1bc843caa6f1da0c6622ee7a7d56e99c31475aR598-R606
        run: git rev-parse --is-shallow-repository

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          extra-conf: |
            sandbox = ${{ matrix.sandbox }}
            extra-substituters = https://kachick.cachix.org
            extra-trusted-public-keys = kachick.cachix.org-1:7giZGKW03gPFkbde09JNpDKCbDGGwBuU/Z11W/jUtEQ=
      - name: Outputs nix version and the config
        run: |
          nix --version
          nix config show

      - name: Ensure sandbox mode
        env:
          EXPECTED_SANDBOX: ${{ matrix.sandbox }}
        run: |
          set -x
          [[ "$(nix config show sandbox)" == "$EXPECTED_SANDBOX" ]]

      - name: Logging disk space
        run: df -h

        # NOTE: These free-up steps removed 14 Gib in 50sec on Linux
        # On the otherhand, additional apt purge step removed 6 Gib in 100s, so I don't want to use the additional steps for now
      - name: Free up disk space
        if: ${{ inputs.free-up-diskspace }}
        run: |
          sudo rm -rf '/opt/ghc'
          sudo rm -rf '/usr/share/dotnet'
          sudo rm -rf '$AGENT_TOOLSDIRECTORY'
          sudo rm -rf '/usr/local/share/boost'
          df -h

      - name: Free up disk space on Linux
        if: ${{ inputs.free-up-diskspace && runner.os == 'Linux' }}
        run: |
          docker images
          docker image prune --all --force
          sudo rm -rf '/usr/local/lib/android'
          df -h

      - name: Install dependencies
        run: nix profile add --inputs-from "${RUNNER_TEMP}/${GITHUB_REPOSITORY}" nixpkgs#nixpkgs-review nixpkgs#nix-eval-jobs nixpkgs#betterleaks nixpkgs#cachix

      - name: Record nixpkgs-review version
        env:
          CACHE_DIR: ${{ steps.get-meta.outputs.cache_dir }}
        run: |
          mkdir -p "${CACHE_DIR}/nixpkgs-review"
          nixpkgs-review --version | tee "${CACHE_DIR}/nixpkgs-review/nixpkgs-review-version.txt"

      - name: Run binary-cached nixpkgs-review for PR
        if: ${{ inputs.pr-number != '' }}
        env:
          # https://github.com/Mic92/nixpkgs-review/blob/055465e55d131ffb1e1617f46d3bade0b87bbe69/README.md?plain=1#L239-L260
          GITHUB_TOKEN: '${{ github.token }}'
          PR_NUMBER: '${{ inputs.pr-number }}'
          RUN_TESTS: '${{ inputs.run-tests }}'
        run: | # shell
          #
          args=()
          if [ "$RUN_TESTS" = "true" ]; then
            args+=('--tests')
          fi
          nixpkgs-review pr "$PR_NUMBER" --print-result "${args[@]}"

      - name: Run binary-cached nixpkgs-review for custom args
        if: ${{ inputs.args != '' }}
        env:
          # https://github.com/Mic92/nixpkgs-review/blob/055465e55d131ffb1e1617f46d3bade0b87bbe69/README.md?plain=1#L239-L260
          GITHUB_TOKEN: '${{ github.token }}'
          REVIEW_ARGS: '${{ inputs.args }}'
        run: | # shell
          #
          nixpkgs-review $REVIEW_ARGS

      - name: Logging disk space
        run: df -h

      - name: Annotate Darwin sandbox setting in report
        if: ${{ runner.os == 'macOS' }}
        env:
          CACHE_DIR: ${{ steps.get-meta.outputs.cache_dir }}
          MATRIX_SANDBOX: ${{ matrix.sandbox }}
        run: |
          find "${CACHE_DIR}/nixpkgs-review" -type f -name "report.md" -exec ruby -i -pe 'gsub(/^### `aarch64-darwin`/, "### `aarch64-darwin` (sandbox=" + ENV.fetch("MATRIX_SANDBOX") + ")")' {} +

      - name: Scan review directory for secret leaks
        env:
          CACHE_DIR: ${{ steps.get-meta.outputs.cache_dir }}
        run: |
          betterleaks dir "${CACHE_DIR}/nixpkgs-review" --no-banner --redact=100

      - name: Push and pin packages to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHE_DIR: ${{ steps.get-meta.outputs.cache_dir }}
          PR_NUMBER: '${{ inputs.pr-number }}'
          REVIEW_ARGS: '${{ inputs.args }}'
        run: | # shell
          #
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "CACHIX_AUTH_TOKEN is not set; skipping Cachix push"
            exit 0
          fi

          results_dir="$(find "${CACHE_DIR}/nixpkgs-review" -type d -name "results" | head -n 1)"
          if [ -z "$results_dir" ] || [ ! -d "$results_dir" ]; then
            echo "No results directory found; skipping Cachix push"
            exit 0
          fi

          entries=()
          store_paths=()
          for item in "$results_dir"/*; do
            [ -e "$item" ] || continue
            target="$(readlink "$item")"
            [ -e "$target" ] || continue
            name="$(basename "$item")"
            entries+=("{ name = \"$name\"; path = builtins.storePath \"$target\"; }")
            store_paths+=("$target")
          done

          if [ ${#store_paths[@]} -eq 0 ]; then
            echo "No built packages found in $results_dir; skipping Cachix push"
            exit 0
          fi

          unique_store_paths=()
          while IFS= read -r p; do
            [ -n "$p" ] && unique_store_paths+=("$p")
          done < <(printf '%s\n' "${store_paths[@]}" | sort -u)

          # Check size limit: skip if total NAR size exceeds 2GiB (2 * 1024 * 1024 * 1024 bytes)
          max_bytes=$((2 * 1024 * 1024 * 1024))
          total_bytes=$(nix path-info --size "${unique_store_paths[@]}" | awk '{sum += $2} END {print sum}')

          if [ -n "$total_bytes" ] && [ "$total_bytes" -gt "$max_bytes" ]; then
            echo "::warning::Skipping Cachix push: total package size (${total_bytes} bytes) exceeds 2GiB limit"
            exit 0
          fi

          if [ -n "$PR_NUMBER" ]; then
            pin_name="review-nixpkgs-${PR_NUMBER}"
          elif [ -n "$REVIEW_ARGS" ]; then
            if command -v sha256sum > /dev/null 2>&1; then
              args_hash=$(echo -n "$REVIEW_ARGS" | sha256sum | cut -c1-12)
            else
              args_hash=$(echo -n "$REVIEW_ARGS" | shasum -a 256 | cut -c1-12)
            fi
            pin_name="review-nixpkgs-${args_hash}"
          else
            echo "::warning::Neither PR_NUMBER nor REVIEW_ARGS is provided. Skipping Cachix pin."
            exit 0
          fi

          nix_expr="let pkgs = import <nixpkgs> {}; in pkgs.linkFarm \"${pin_name}\" [ $(printf '%s ' "${entries[@]}") ]"
          link_farm_path=$(nix build --impure --no-link --print-out-paths --expr "$nix_expr")

          cachix push kachick "$link_farm_path" "${unique_store_paths[@]}"
          cachix pin kachick "$pin_name" "$link_farm_path" --keep-days 21

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'nixpkgs-review-files-pr-${{ inputs.pr-number }}-${{ matrix.asset_name }}'
          path: '${{ steps.get-meta.outputs.cache_dir }}/nixpkgs-review/'
          if-no-files-found: 'error'
          # This is a broken change in their minor version updates. See https://github.com/actions/upload-artifact/commit/cb6558bb10fe4afe4054d0be4b3136e673eb5e7f and https://github.com/actions/upload-artifact/pull/598
          include-hidden-files: 'true' # Required for `bin/.bin-wrapped`

  report:
    name: report
    needs: [review]
    uses: $/.github/workflows/report.yml
    with:
      run_id: '${{ github.run_id }}'
