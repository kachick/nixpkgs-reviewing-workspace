name: Go
on:
  push:
    branches: [main]
    paths:
      - 'pkgs/**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - '.github/workflows/go.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pkgs/**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - '.github/workflows/go.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.work'
          cache: true

      - name: Vet
        run: go vet ./pkgs/resume/...

  test:
    name: test
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.work'
          cache: true

      - name: Test
        run: go test -v ./pkgs/resume/...
