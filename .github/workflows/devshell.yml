name: 🐚
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every 10:42 JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '42 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tasks:
    name: tasks
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          # - ubuntu-26.04-arm # aarch64-linux
          # - macos-26 # aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          # access-tokens: Prevent GitHub API rate limiting during `nix run github:`
          extra-conf: |
            sandbox = true
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}
            extra-substituters = https://kachick.cachix.org
            extra-trusted-public-keys = kachick.cachix.org-1:7giZGKW03gPFkbde09JNpDKCbDGGwBuU/Z11W/jUtEQ=
      - name: Ensure sandbox mode
        run: |
          set -x
          [[ "$(nix config show sandbox)" == 'true' ]]
      - run: nix flake check
      - run: nix flake show
      - name: Install direnv
        run: nix profile add --inputs-from . nixpkgs#direnv
      - name: Load environment variables
        run: |
          direnv allow .
          direnv export gha > "$GITHUB_ENV"
      - run: task check
      - name: Push and pin packages to Cachix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        # Cachix pins a single store path per revision, so combine all packages into one linkFarm
        run: |
          nix profile add --inputs-from . nixpkgs#cachix
          store_path="$(nix build --impure --no-link --print-out-paths --expr '
            let
              f = builtins.getFlake (toString ./.);
              system = builtins.currentSystem;
              pkgs = f.inputs.nixpkgs.legacyPackages.${system};
            in
              pkgs.linkFarm "nixpkgs-reviewing-workspace" (
                map (name: {
                  inherit name;
                  path = f.packages.${system}.${name};
                }) (builtins.attrNames f.packages.${system})
              )
          ')"
          cachix push kachick "$store_path"
          cachix pin kachick nixpkgs-reviewing-workspace "$store_path" --keep-revisions 10
