# https://taskfile.dev/styleguide/
# Avoid chaining commands with ; or && in a single line. Use multiple cmd items for independent steps, or write a script under scripts/ instead.

version: '3'

tasks:
  default:
    deps:
      - task: fmt
      - task: lint
      - task: test

  check:
    deps:
      - task: test
      - task: lint

  test:
    cmds:
      - go test ./pkgs/resume/...

  fmt:
    cmds:
      - dprint fmt

  lint:
    cmds:
      - go vet ./pkgs/resume/...
      - dprint check
      - typos . .github
      - zizmor --pedantic .
      - pnpm dlx github:kachick/ghadiag#d954502858fe913fc6de35e9e3fecc228e4e2547
