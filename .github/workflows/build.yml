name: 🧪
# https://stackoverflow.com/questions/71155641/github-actions-how-to-view-inputs-for-workflow-dispatch
run-name: '${{ inputs.pnames }}: ${{ inputs.repository }}#${{ inputs.ref }}'
# run-name: '[Experimental] plemoljp-nf: kachick/nixpkgs#aa32ada9e1344d0a3abb64ffc806f8b07732fe4c' # Enable only when developing
on:
  # pull_request: # Enable only when developing
  workflow_dispatch:
    inputs:
      # Accept multiple packages for use-case of crystal. e.g crystal_1_11 and crystal_1_16
      pnames:
        description: 'Package names to build'
        required: true
        type: string
        default: |
          [ "gnugrep" ]
      repository:
        description: 'GitHub repository'
        # Cannot use ${{ github.repository_owner }} here.
        default: 'kachick/nixpkgs'
        required: true
        type: string
      ref:
        description: 'git ref'
        default: 'nixpkgs-unstable'
        required: true
        type: string
      x86_64-linux:
        description: 'x86_64-linux (ubuntu-26.04)'
        type: boolean
        default: true
      aarch64-linux:
        description: 'aarch64-linux (ubuntu-26.04-arm)'
        type: boolean
        default: true
      aarch64-darwin:
        description: 'aarch64-darwin (macos-26, sandbox=true)'
        type: boolean
        default: true
      aarch64-darwin-relaxed:
        description: 'aarch64-darwin (macos-26, sandbox=false)'
        type: boolean
        default: true
      force-rebuild:
        description: Force rebuild
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.pnames }}-${{ inputs.repository }}-${{ inputs.ref }}
  cancel-in-progress: true

# env: # Enable only when developing
#   pname: 'plemoljp-nf'
#   repository: 'kachick/nixpkgs'
#   ref: 'aa32ada9e1344d0a3abb64ffc806f8b07732fe4c'

jobs:
  setup:
    name: setup
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: set-matrix
        env:
          ENABLE_X86_64_LINUX: ${{ inputs.x86_64-linux }}
          ENABLE_AARCH64_LINUX: ${{ inputs.aarch64-linux }}
          ENABLE_AARCH64_DARWIN: ${{ inputs.aarch64-darwin }}
          ENABLE_AARCH64_DARWIN_RELAXED: ${{ inputs.aarch64-darwin-relaxed }}
        run: |
          matrix=()
          if [ "$ENABLE_X86_64_LINUX" = "true" ]; then
            matrix+=('{"name":"x86_64-linux","runner":"ubuntu-26.04","sandbox":true,"asset_name":"X64-Linux"}')
          fi
          if [ "$ENABLE_AARCH64_LINUX" = "true" ]; then
            matrix+=('{"name":"aarch64-linux","runner":"ubuntu-26.04-arm","sandbox":true,"asset_name":"ARM64-Linux"}')
          fi
          if [ "$ENABLE_AARCH64_DARWIN" = "true" ]; then
            matrix+=('{"name":"aarch64-darwin (sandbox=true)","runner":"macos-26","sandbox":true,"asset_name":"ARM64-macOS-sandbox-true"}')
          fi
          if [ "$ENABLE_AARCH64_DARWIN_RELAXED" = "true" ]; then
            matrix+=('{"name":"aarch64-darwin (sandbox=false)","runner":"macos-26","sandbox":false,"asset_name":"ARM64-macOS-sandbox-false"}')
          fi

          if [ ${#matrix[@]} -eq 0 ]; then
            echo "❌ Error: At least one target must be selected." >&2
            exit 1
          fi

          json="[$(IFS=,; echo "${matrix[*]}")]"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target.name }}, ${{ matrix.pname }})
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.setup.outputs.matrix) }}
        pname: ${{ fromJson(inputs.pnames) }}
    runs-on: ${{ matrix.target.runner }}
    # timeout-minutes: 180 # Any limitations might not fit for this repository. So temporary disabling
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: '${{ inputs.repository }}'
          ref: '${{ inputs.ref }}'
          persist-credentials: false

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          extra-conf: |
            sandbox = ${{ matrix.target.sandbox }}

      - name: Outputs nix version and the config
        run: |
          nix --version
          nix config show

      - name: Ensure sandbox mode
        env:
          EXPECTED_SANDBOX: ${{ matrix.target.sandbox }}
        run: |
          set -x
          [[ "$(nix config show sandbox)" == "$EXPECTED_SANDBOX" ]]

      - name: Build
        env:
          FORCE_REBUILD: ${{ inputs.force-rebuild }}
          PACKAGE_NAME: ${{ matrix.pname }}
        run: |
          if [[ "$FORCE_REBUILD" == 'true' ]]; then
            nix-build --attr "pkgs.$PACKAGE_NAME" --option substitute false
          else
            nix-build --attr "pkgs.$PACKAGE_NAME"
          fi

      - name: Sanitize artifact name
        id: artifact
        env:
          RAW_NAME: 'build-${{ matrix.pname }}-${{ inputs.ref }}-${{ matrix.target.asset_name }}'
        run: |
          sanitized=$(printf '%s' "$RAW_NAME" | tr '/\\:*?"<>|\r\n' '-')
          echo "name=$sanitized" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: '${{ steps.artifact.outputs.name }}'
          path: './result*'
          if-no-files-found: 'error'
          # This is a broken change in their minor version updates. See https://github.com/actions/upload-artifact/commit/cb6558bb10fe4afe4054d0be4b3136e673eb5e7f and https://github.com/actions/upload-artifact/pull/598
          include-hidden-files: 'true' # Required for `bin/.bin-wrapped`
